plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    loom.injectAccessWidener(tasks.named('shadowJar'))
    runs {
        datagen {
            server()

            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"

            runDir "build/datagen"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

repositories {
    maven { url "https://maven.shedaniel.me" }
    maven { url 'https://maven.blamejared.com' }
    maven {
        name 'Gegy'
        url 'https://maven.gegy.dev'
    }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven { url 'https://jitpack.io' }
    maven {
        url = uri("https://storage.googleapis.com/devan-maven/")
    }
    maven {
        // location of the maven that hosts JEI files
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://maven.twelveiterations.com/repository/maven-public/"

        content {
            includeGroup "net.blay09.mods"
        }
    }
    maven { url 'https://maven.fallenbreath.me/releases' }
}

if (rootProject.sandwichable_compatibility == "true") {
    dependencies {
        implementation("maven.modrinth:sandwichable:${rootProject.sandwichable_version}"){
            exclude(group: "net.fabricmc.fabric-api")
        }
        implementation("dev.lambdaurora:spruceui:${rootProject.spruceui_version}"){
            exclude(group: "net.fabricmc.fabric-api")
        }
    }
}
else {
    dependencies {
        compileOnly("maven.modrinth:sandwichable:${rootProject.sandwichable_version}"){
            exclude(group: "net.fabricmc.fabric-api")
        }
    }
}

if (rootProject.rei_compatibility == "true"){
    dependencies {
        implementation("me.shedaniel:RoughlyEnoughItems-fabric:${rootProject.rei_version}"){
            transitive(false)
        }
        runtimeOnly("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
            exclude(group: "net.fabricmc.fabric-api")
        }
        runtimeOnly("dev.architectury:architectury-fabric:${rootProject.architectury_version}") {
            exclude(group: "net.fabricmc.fabric-api")
        }
    }
} else {
    dependencies {
        compileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rootProject.rei_version}"){
            transitive(false)
        }
    }
}

if (rootProject.patchouli_compatibility == "true") {
    dependencies {
        implementation("vazkii.patchouli:patchouli-fabric:${rootProject.patchouli_version_fabric}"){
            exclude(group: "net.fabricmc.fabric-api")
        }
    }
}
else {
    dependencies {
        compileOnly("vazkii.patchouli:patchouli-fabric:${rootProject.patchouli_version_fabric}"){
            exclude(group: "net.fabricmc.fabric-api")
        }
    }
}

if (rootProject.immersive_portals_compatibility_fabric == "true"){
    dependencies {
        implementation ("com.github.iPortalTeam:ImmersivePortalsMod:${rootProject.immersive_portals_version_fabric}"){
            exclude(group: "net.fabricmc.fabric-api")
        }
    }
}

if (rootProject.lazy_dfu_enabled == "true"){
    dependencies {
        runtimeOnly ("maven.modrinth:lazydfu:${rootProject.lazy_dfu_version_fabric}")
    }
}
if (rootProject.jei_compatibility == "true") {
    dependencies {
        runtimeOnly("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}")
    }
}

if (rootProject.cookingfor_blockheads_compatibility_fabric == "true") {
    dependencies {
        implementation "curse.maven:balm-fabric-531761:${rootProject.balm_version_fabric}"
        implementation "curse.maven:cooking-for-blockheads-fabric-231484:${rootProject.cookingforblockheads_version_fabric}"
        api("net.blay09.mods:kuma-api-fabric:$rootProject.kuma_version")
    }
} else {
    dependencies {
        compileOnly "curse.maven:balm-fabric-531761:${rootProject.balm_version_fabric}"
        compileOnly "curse.maven:cooking-for-blockheads-fabric-231484:${rootProject.cookingforblockheads_version_fabric}"
    }
}


dependencies {
    // To change the versions see the gradle.properties file

    // Fabric API. This is technically optional, but you probably want it anyway.

    implementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
        transitive(false)
    }

   // runtimeOnly("com.terraformersmc:terrestria:${rootProject.terrestria}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rootProject.rei_version}") {
        transitive(false)
    }
    compileOnly("maven.modrinth:iris:${rootProject.iris_version}")

    compileOnly("maven.modrinth:farmers-delight-refabricated:${rootProject.farmers_delight_version_fabric}"){
        exclude(group: "net.fabricmc.fabric-api")
    }

    compileOnlyApi("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}") {
        exclude group: "mezz.jei"
    }

    compileOnly("com.github.iPortalTeam:ImmersivePortalsMod:${rootProject.immersive_portals_version_fabric}"){
        exclude(group: "net.fabricmc.fabric-api")
        transitive(false)
    }
    compileOnly("com.github.iPortalTeam:DimLib:${rootProject.dimlib_version_fabric}"){
        exclude(group: "net.fabricmc.fabric-api")
        transitive(false)
    }

    include(implementation("com.github.SvenWoltmann:color-thief-java:${rootProject.color_thief_version}"))
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.5.3")))

    implementation 'me.fallenbreath:conditional-mixin-fabric:0.6.4'
    include 'me.fallenbreath:conditional-mixin-fabric:0.6.4'
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    api "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_api_version}"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    inputs.property "version", project.version
    inputs.property "supported_minecraft_version", rootProject.supported_minecraft_version  // i hate gradle

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
        "supported_minecraft_version": rootProject.supported_minecraft_version
    }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    "src/main/generated"
            ]
        }
    }
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "fabric-mc${rootProject.minecraft_version}"
}

jar {
    archiveClassifier = "raw"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

configurations.all {
    resolutionStrategy {
        force("net.fabricmc:fabric-loader:$rootProject.fabric_loader_version")
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

configurations.configureEach {
    resolutionStrategy {
        force("net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}")
    }
}