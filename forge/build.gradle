plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {

        mixinConfig "pfm-common.mixins.json"
        mixinConfig "pfm.mixins.json"

    }
}

loom.getForge().convertAccessWideners(tasks.named('shadowJar'), 'pfm.accesswidener')

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

repositories {
    maven { url 'https://maven.blamejared.com' }
    maven {
        // location of the maven that hosts JEI files
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://maven.twelveiterations.com/repository/maven-public/"

        content {
            includeGroup "net.blay09.mods"
        }
    }
    maven { url 'https://jitpack.io' }
}


dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    compileOnly("vazkii.patchouli:patchouli-neoforge:${rootProject.patchouli_version_forge}")
    //compileOnlyApi("mezz.jei:jei-1.21.8-forge-api:${rootProject.jei_version}")
    compileOnlyApi("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rootProject.rei_version}") {
        transitive(false)
    }
    compileOnlyApi("me.shedaniel:RoughlyEnoughItems-neoforge:${rootProject.rei_version}") {
        transitive(false)
    }
    //runtimeOnly("curse.maven:biomesop-220318:3562256")
    compileOnly("maven.modrinth:iris:${rootProject.oculus_version}")

    compileOnly "curse.maven:farmers-delight-forge-398521:${rootProject.farmers_delight_version_forge}"
    compileOnly(files("../libs/immersive-portals-2.5.4-mc1.19.3-forge.jar"))

    include(forgeRuntimeLibrary("com.github.SvenWoltmann:color-thief-java:${rootProject.color_thief_version}"))

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.3"))
}

if(rootProject.jei_compatibility == "true") {
    dependencies {
        //runtimeOnly("mezz.jei:jei-1.21.8-forge:${rootProject.jei_version}")
    }
}
if (rootProject.immersive_portals_compatibility_forge == "true"){
    dependencies {
        implementation("curse.maven:imm_ptl-355440:${rootProject.immersive_portals_version_forge}")
    }
}

if (rootProject.lazy_dfu_enabled == "true"){
    dependencies {
        runtimeOnly ("curse.maven:lazydfu-460819:${rootProject.lazy_dfu_version_forge}")
    }
}

if (rootProject.rei_compatibility == "true"){
    dependencies {
        compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rootProject.rei_version}")
    }
} else {
    dependencies {
        compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rootProject.rei_version}")
    }
}

if (rootProject.cookingfor_blockheads_compatibility_forge == "true") {
    dependencies {
        implementation "curse.maven:balm-forge-531761:${rootProject.balm_version_forge}"
        implementation "curse.maven:cooking-for-blockheads-forge-231484:${rootProject.cookingforblockheads_version_forge}"
        api("net.blay09.mods:kuma-api-forge:$rootProject.kuma_version_forge")
    }
} else {
    dependencies {
        compileOnly "curse.maven:balm-forge-531761:${rootProject.balm_version_forge}"
        compileOnly "curse.maven:cooking-for-blockheads-forge-231484:${rootProject.cookingforblockheads_version_forge}"
    }
}


processResources {
    inputs.property "version", project.version
    inputs.property "supported_minecraft_version", rootProject.supported_minecraft_version  // i hate gradle

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version,
        "supported_minecraft_version": rootProject.supported_minecraft_version
    }
    duplicatesStrategy = 'include'
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "minecraftforge-mc${rootProject.minecraft_version}"
}

jar {
    archiveClassifier = "raw"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = 'include'
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

configurations.all {
    resolutionStrategy.force("net.sf.jopt-simple:jopt-simple:5.0.4")
}
